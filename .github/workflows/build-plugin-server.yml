name: 手动构建插件服务器

on:
  workflow_dispatch:
    inputs:
      artifact_type:
        description: 构建产物类型
        required: true
        type: choice
        options:
          - executable
          - shared
        default: executable
      target_platform:
        description: 目标平台
        required: true
        type: choice
        options:
          - linux
          - windows
          - macos
        default: linux
      build_type:
        description: 构建类型
        required: true
        type: choice
        options:
          - Release
          - Debug
        default: Release

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.target_platform }} / ${{ inputs.artifact_type }} / ${{ inputs.build_type }}
    runs-on: ${{ inputs.target_platform == 'windows' && 'windows-latest' || inputs.target_platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      BUILD_ARTIFACT: ${{ inputs.artifact_type == 'shared' && 'SHARED' || 'EXECUTABLE' }}
    steps:
      - uses: actions/checkout@v4

      - name: 准备 OpenSSL（Windows）
        if: inputs.target_platform == 'windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          & "$vcpkg\vcpkg.exe" install openssl:x64-windows

      - name: 准备 OpenSSL（macOS）
        if: inputs.target_platform == 'macos'
        run: brew install openssl@3

      - name: 配置（Linux）
        if: inputs.target_platform == 'linux'
        run: cmake -S native-server -B native-server/build-manual -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DPLUGMESH_BUILD_ARTIFACT="$BUILD_ARTIFACT"

      - name: 配置（macOS）
        if: inputs.target_platform == 'macos'
        run: |
          cmake -S native-server -B native-server/build-manual \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DPLUGMESH_BUILD_ARTIFACT="$BUILD_ARTIFACT" \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: 配置（Windows）
        if: inputs.target_platform == 'windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          cmake -S native-server -B native-server/build-manual -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DPLUGMESH_BUILD_ARTIFACT="$env:BUILD_ARTIFACT"

      - name: 构建（Linux / macOS）
        if: inputs.target_platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          target=plugmesh-server
          if [ "$BUILD_ARTIFACT" = SHARED ]; then target=plugmesh-server-shared; fi
          cmake --build native-server/build-manual --target "$target" plugmesh-plugin-host --parallel

      - name: 构建（Windows）
        if: inputs.target_platform == 'windows'
        shell: pwsh
        run: |
          $target = if ($env:BUILD_ARTIFACT -eq 'SHARED') { 'plugmesh-server-shared' } else { 'plugmesh-server' }
          cmake --build native-server/build-manual --target $target plugmesh-plugin-host --config $env:BUILD_TYPE --parallel

      - name: 打包（Linux）
        if: inputs.target_platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          package="plugmesh-plugin-server-linux-${{ inputs.artifact_type }}-${{ inputs.build_type }}"
          mkdir -p "dist/$package"
          if [ "$BUILD_ARTIFACT" = SHARED ]; then
            cp native-server/build-manual/libplugmesh-server.so "dist/$package/"
            cp native-server/include/plugmesh/server_api.h "dist/$package/"
          else
            cp native-server/build-manual/plugmesh-server "dist/$package/"
          fi
          cp native-server/build-manual/plugmesh-plugin-host "dist/$package/"
          for library in libssl.so.3 libcrypto.so.3; do
            library_path="$(ldconfig -p | awk -v library="$library" '$1 == library { print $NF; exit }')"
            if [ -z "$library_path" ] || [ ! -f "$library_path" ]; then
              echo "未找到 Linux OpenSSL 运行库：$library" >&2
              exit 1
            fi
            cp -L "$library_path" "dist/$package/"
          done
          cp native-server/include/plugmesh/plugin_api.h "dist/$package/"
          cp native-server/README.md "dist/$package/"
          printf '类型：%s\n平台：Linux x86_64\n构建类型：%s\n' "${{ inputs.artifact_type }}" "${{ inputs.build_type }}" > "dist/$package/BUILD-INFO.txt"
          archive="$package.tar.gz"
          tar -C dist -czf "dist/$archive" "$package"
          (cd dist && sha256sum "$archive" > SHA256SUMS)

      - name: 打包（macOS）
        if: inputs.target_platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          package="plugmesh-plugin-server-macos-${{ inputs.artifact_type }}-${{ inputs.build_type }}"
          mkdir -p "dist/$package"
          if [ "$BUILD_ARTIFACT" = SHARED ]; then
            cp native-server/build-manual/libplugmesh-server.dylib "dist/$package/"
            cp native-server/include/plugmesh/server_api.h "dist/$package/"
          else
            cp native-server/build-manual/plugmesh-server "dist/$package/"
          fi
          cp native-server/build-manual/plugmesh-plugin-host "dist/$package/"
          cp native-server/include/plugmesh/plugin_api.h "dist/$package/"
          cp native-server/README.md "dist/$package/"
          printf '类型：%s\n平台：macOS\n构建类型：%s\n' "${{ inputs.artifact_type }}" "${{ inputs.build_type }}" > "dist/$package/BUILD-INFO.txt"
          archive="$package.tar.gz"
          tar -C dist -czf "dist/$archive" "$package"
          (cd dist && shasum -a 256 "$archive" > SHA256SUMS)

      - name: 打包（Windows）
        if: inputs.target_platform == 'windows'
        shell: pwsh
        run: |
          $package = "plugmesh-plugin-server-windows-${{ inputs.artifact_type }}-${{ inputs.build_type }}"
          $root = "dist/$package"
          $config = $env:BUILD_TYPE
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          if ($env:BUILD_ARTIFACT -eq 'SHARED') {
            Copy-Item "native-server/build-manual/$config/plugmesh-server.dll" "$root/"
            Copy-Item "native-server/build-manual/$config/plugmesh-server.lib" "$root/"
            Copy-Item native-server/include/plugmesh/server_api.h "$root/"
          } else {
            Copy-Item "native-server/build-manual/$config/plugmesh-server.exe" "$root/"
          }
          Copy-Item "native-server/build-manual/$config/plugmesh-plugin-host.exe" "$root/"
          Get-ChildItem "$vcpkg/installed/x64-windows/bin/*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination $root -Force
          Copy-Item native-server/include/plugmesh/plugin_api.h "$root/"
          Copy-Item native-server/README.md "$root/"
          "类型：${{ inputs.artifact_type }}`n平台：Windows x64`n构建类型：${{ inputs.build_type }}" | Set-Content -Encoding utf8 "$root/BUILD-INFO.txt"
          $archive = "$package.zip"
          Compress-Archive -Path "$root/*" -DestinationPath "dist/$archive" -Force
          (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower() + "  $archive" | Set-Content -Encoding ascii dist/SHA256SUMS

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: plugmesh-plugin-server-${{ inputs.target_platform }}-${{ inputs.artifact_type }}-${{ inputs.build_type }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
