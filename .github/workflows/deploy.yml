name: 部署 Plugmesh Worker

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-plugmesh-worker
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 校验凭据
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::仓库缺少 CLOUDFLARE_API_TOKEN Secret。请在 Settings → Secrets and variables → Actions 中添加 Cloudflare API Token（Workers Scripts:Edit、D1:Edit、R2:Edit）。"
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 校验 Cloudflare 令牌
        run: npx wrangler whoami

      - name: 一键部署
        run: npm run deploy:worker

      - name: 输出部署摘要
        if: success()
        run: |
          {
            echo "### Plugmesh Worker 部署完成"
            echo ""
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 触发：${{ github.event_name }}"
            if [ -f .wrangler/plugmesh-setup-token ]; then
              echo ""
              echo "### 首次初始化令牌"
              echo ""
              echo "> 此令牌只在首次生成 SETUP_TOKEN 时出现。打开已配置的 \`/setup\` 页面后填写。"
              echo ""
              echo '```'
              cat .wrangler/plugmesh-setup-token
              echo '```'
              echo ""
              echo "初始化完成并确认首个管理员可登录后，建议删除 Cloudflare 中的 \`SETUP_TOKEN\` Secret。"
            else
              echo ""
              echo "- 未生成本地初始化令牌文件：远端 \`SETUP_TOKEN\` 已存在，或本次使用了显式覆盖。"
            fi
            echo ""
            echo "后续请在管理后台配置 GitHub / Cloudflare OAuth、SMTP、配额等业务设置。"
          } >> "$GITHUB_STEP_SUMMARY"
