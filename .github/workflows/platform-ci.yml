name: 平台验收

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: UI 约定审计
        run: npm run ui:conventions
      - name: Worker 类型检查
        run: npm run worker:typecheck
      - name: 构建管理端
        run: npm run build
      - name: Worker smoke
        run: npm run worker:smoke
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium
      - name: 管理端 UI smoke
        run: npm run ui:smoke

  linux-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 配置
        run: cmake -S native-server -B native-server/build -DCMAKE_BUILD_TYPE=Release
      - name: 构建
        run: cmake --build native-server/build --parallel
      - name: 测试
        working-directory: native-server/build
        run: ctest --output-on-failure

  windows-native:
    runs-on: windows-latest
    env:
      PLUGMESH_TEST_SYSTEM_CREDENTIALS: required
    steps:
      - uses: actions/checkout@v4
      - name: 配置
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          & "$vcpkg\vcpkg.exe" install openssl:x64-windows
          cmake -S native-server -B native-server/build-win -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: 构建
        run: cmake --build native-server/build-win --config Release --parallel
      - name: 测试
        shell: pwsh
        working-directory: native-server/build-win
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          $env:PATH = "$vcpkg\installed\x64-windows\bin;$env:PATH"
          ctest -C Release --output-on-failure

  macos-native:
    runs-on: macos-latest
    env:
      PLUGMESH_TEST_SYSTEM_CREDENTIALS: required
    steps:
      - uses: actions/checkout@v4
      - name: 准备临时钥匙串
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/plugmesh-test.keychain-db"
          security create-keychain -p plugmesh-ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p plugmesh-ci "$keychain"
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: 配置
        shell: bash
        run: |
          brew install openssl@3
          cmake -S native-server -B native-server/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: 构建
        run: cmake --build native-server/build --parallel
      - name: 测试
        working-directory: native-server/build
        run: ctest --output-on-failure
      - name: 清理临时钥匙串
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/plugmesh-test.keychain-db" || true
