name: 平台验收

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'native-server/**'
              - '.github/workflows/platform-ci.yml'

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 固定到与 package-lock 中 @playwright/test 1.55.1 对应的官方镜像：
    # ubuntu-latest 的系统字体与浏览器版本会随镜像迁移漂移，导致像素基线与 CI 不一致。
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: UI 约定审计
        run: npm run ui:conventions
      - name: 样式死代码审计
        run: npm run ui:css-audit
      - name: 原生 Release 打包契约
        run: npm run release:workflow:test
      - name: Native service lifecycle contract
        run: npm run native:service:test
      - name: Worker 类型检查
        run: npm run worker:typecheck
      - name: 构建管理端
        run: npm run build
      - name: Worker smoke
        run: npm run worker:smoke
      - name: 管理端 UI smoke
        run: npm run ui:smoke
      - name: 汇总失败用例
        if: failure()
        run: node scripts/playwright-failures.mjs /tmp/plugmesh-playwright-report/results.json
      - name: 上传 UI smoke 失败产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            /tmp/plugmesh-playwright
            /tmp/plugmesh-playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # 原生验收只在 native-server 或本工作流变化时运行；凭据相关用例在缺少系统凭据时回退到加密凭据文件。
  linux-native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建内嵌 UI
        run: |
          npm ci
          npm run native-ui:build
      - name: 配置
        run: cmake -S native-server -B native-server/build -DCMAKE_BUILD_TYPE=Release -DPLUGMESH_REQUIRE_EMBEDDED_UI=ON
      - name: 构建
        shell: bash
        run: |
          set -o pipefail
          cmake --build native-server/build --parallel 2>&1 | tee "$RUNNER_TEMP/native-build.log"
      - name: 测试
        working-directory: native-server/build
        run: ctest --output-on-failure -V
      - name: 构建失败摘要
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/native-build.log"
          [ -f "$log" ] || exit 0
          # 没有匹配行时 grep 返回 1；本步骤只在失败时运行，不能因为“没摘要”再失败一次。
          grep -E "error:|fatal error|错误|FAILED:" "$log" | head -10 | while IFS= read -r line; do echo "::error::${line}"; done || true
          exit 0
      - name: 测试失败摘要
        if: failure()
        shell: bash
        run: |
          failed=native-server/build/Testing/Temporary/LastTestsFailed.log
          detail=native-server/build/Testing/Temporary/LastTest.log
          if [ -f "$failed" ]; then
            head -10 "$failed" | while IFS= read -r line; do echo "::error::ctest ${line}"; done || true
          fi
          # 用例名不够定位问题时，把日志里的断言/错误行也贴到 check-run 上。
          if [ -f "$detail" ]; then
            grep -nE "Failed|FAILED|error|Error|Expected|Actual|assert" "$detail" | head -20 | while IFS= read -r line; do echo "::error::${line}"; done || true
          fi
          exit 0
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-logs-linux
          path: |
            native-server/build/Testing/Temporary/LastTest.log
            native-server/build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore

  windows-native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建内嵌 UI
        run: |
          npm ci
          npm run native-ui:build
      - name: 配置
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          & "$vcpkg\vcpkg.exe" install openssl:x64-windows
          # vcpkg 会给每个目标挂 applocal PostBuild 事件，MSBuild 并行构建时多个目标
          # 同时往同一个输出目录复制同名 OpenSSL DLL，偶发共享冲突后以 MSB3073 失败
          # （run 39773741408 的 plugmesh-lifecycle-sample 即此原因，原生代码与全绿
          # 的 run 39770782201 完全一致）。关掉 applocal，改为构建完成后单进程部署一次。
          cmake -S native-server -B native-server/build-win -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DPLUGMESH_REQUIRE_EMBEDDED_UI=ON
      - name: 构建
        shell: pwsh
        run: |
          # MSBuild 会把进度和告警写到 stderr，PowerShell 在 $ErrorActionPreference=Stop
          # 下会把它当成终止错误，从而丢掉真实退出码；这里显式以 cmake 的退出码为准。
          $ErrorActionPreference = 'Continue'
          $log = "$env:RUNNER_TEMP\native-build.log"
          cmake --build native-server/build-win --config Release --parallel 2>&1 |
            Tee-Object -FilePath $log | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 部署 OpenSSL 运行库
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          # applocal 已关闭，这里一次性把运行库放到可执行文件旁；ctest 另有 PATH 兜底。
          Get-ChildItem "$vcpkg\installed\x64-windows\bin\*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination native-server/build-win/Release -Force
      - name: 测试
        shell: pwsh
        working-directory: native-server/build-win
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          $env:PATH = "$vcpkg\installed\x64-windows\bin;$env:PATH"
          ctest -C Release --output-on-failure -V
      - name: 构建失败摘要
        if: failure()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\native-build.log"
          if (-not (Test-Path $log)) { exit 0 }
          Select-String -Path $log -Pattern 'error [A-Z]+\d+|fatal error|CMake Error|error LNK' |
            Select-Object -First 10 | ForEach-Object { Write-Host "::error::$($_.Line)" }
          exit 0
      - name: 测试失败摘要
        if: failure()
        shell: pwsh
        run: |
          $failed = 'native-server/build-win/Testing/Temporary/LastTestsFailed.log'
          $detail = 'native-server/build-win/Testing/Temporary/LastTest.log'
          if (Test-Path $failed) {
            Get-Content $failed | Select-Object -First 10 |
              ForEach-Object { Write-Host "::error::ctest $_" }
          }
          if (Test-Path $detail) {
            Select-String -Path $detail -Pattern 'Failed|FAILED|error|Expected|Actual|assert' |
              Select-Object -First 20 | ForEach-Object { Write-Host "::error::$($_.Line)" }
          }
          exit 0
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-logs-windows
          path: |
            native-server/build-win/Testing/Temporary/LastTest.log
            native-server/build-win/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore

  macos-native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建内嵌 UI
        run: |
          npm ci
          npm run native-ui:build
      - name: 准备临时钥匙串
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/plugmesh-test.keychain-db"
          security create-keychain -p plugmesh-ci "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p plugmesh-ci "$keychain"
          security default-keychain -s "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: 配置
        shell: bash
        run: |
          brew install openssl@3
          cmake -S native-server -B native-server/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DPLUGMESH_REQUIRE_EMBEDDED_UI=ON
      - name: 构建
        shell: bash
        run: |
          set -o pipefail
          cmake --build native-server/build --parallel 2>&1 | tee "$RUNNER_TEMP/native-build.log"
      - name: 测试
        working-directory: native-server/build
        run: ctest --output-on-failure -V
      - name: 构建失败摘要
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/native-build.log"
          [ -f "$log" ] || exit 0
          # 没有匹配行时 grep 返回 1；本步骤只在失败时运行，不能因为“没摘要”再失败一次。
          grep -E "error:|fatal error|错误|FAILED:" "$log" | head -10 | while IFS= read -r line; do echo "::error::${line}"; done || true
          exit 0
      - name: 测试失败摘要
        if: failure()
        shell: bash
        run: |
          failed=native-server/build/Testing/Temporary/LastTestsFailed.log
          detail=native-server/build/Testing/Temporary/LastTest.log
          if [ -f "$failed" ]; then
            head -10 "$failed" | while IFS= read -r line; do echo "::error::ctest ${line}"; done || true
          fi
          # 用例名不够定位问题时，把日志里的断言/错误行也贴到 check-run 上。
          if [ -f "$detail" ]; then
            grep -nE "Failed|FAILED|error|Error|Expected|Actual|assert" "$detail" | head -20 | while IFS= read -r line; do echo "::error::${line}"; done || true
          fi
          exit 0
      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-logs-macos
          path: |
            native-server/build/Testing/Temporary/LastTest.log
            native-server/build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
      - name: 清理临时钥匙串
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/plugmesh-test.keychain-db" || true
