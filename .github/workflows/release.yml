name: 发布原生端

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 发布标签（必须以 v 开头，例如 v1.0.0）
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 校验发布标签
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验发布包契约
        run: bash scripts/release-workflow.test.sh

      - name: 校验 Termux CLI 契约
        run: bash scripts/termux-build.test.sh

      - name: 校验发布标签
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[^/[:space:]]+$ ]]; then
            echo "::error::发布标签必须以 v 开头且不能包含斜杠或空格：$RELEASE_TAG"
            exit 1
          fi
          echo "发布标签：$RELEASE_TAG"

  build:
    name: 构建 ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            archive: plugmesh-server-linux.zip
          - os: windows-latest
            name: windows
            archive: plugmesh-server-windows.zip
          - os: macos-latest
            name: macos
            archive: plugmesh-server-macos.zip
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Node.js 和本地 UI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建本地 UI
        run: |
          npm ci
          npm run native-ui:build

      - name: 准备 vcpkg OpenSSL（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          & "$vcpkg\vcpkg.exe" install openssl:x64-windows

      - name: 准备 OpenSSL（macOS）
        if: runner.os == 'macOS'
        run: brew install openssl@3

      - name: 配置（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          # 与 platform-ci.yml 一致：关闭 vcpkg applocal，避免并行构建时多个目标
          # 同时复制同名 OpenSSL DLL 而失败；运行库在打包步骤里显式复制。
          cmake -S native-server -B native-server/build-win -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_APPLOCAL_DEPS=OFF

      - name: 配置（macOS）
        if: runner.os == 'macOS'
        run: |
          cmake -S native-server -B native-server/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: 构建和打包 Linux 兼容基线
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src debian:11 \
            bash scripts/build-linux-native.sh \
              --artifact-type ALL \
              --build-type Release \
              --package-name plugmesh-server \
              --archive-name plugmesh-server-linux.zip \
              --archive-format zip \
              --include-ui

      - name: 构建（macOS）
        if: runner.os == 'macOS'
        run: cmake --build native-server/build --parallel

      - name: 构建（Windows）
        if: runner.os == 'Windows'
        run: cmake --build native-server/build-win --config Release --parallel

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = 'C:\vcpkg' }
          New-Item -ItemType Directory -Force -Path dist/plugmesh-server | Out-Null
          Copy-Item native-server/build-win/Release/plugmesh-server.exe dist/plugmesh-server/
          New-Item -ItemType Directory -Force -Path dist/plugmesh-server/native-ui/dist | Out-Null
          Copy-Item native-ui/dist/* dist/plugmesh-server/native-ui/dist/ -Recurse -Force
          Copy-Item native-server/README.md dist/plugmesh-server/README.md
          Copy-Item native-server/build-win/Release/plugmesh-plugin-host.exe dist/plugmesh-server/
          New-Item -ItemType Directory -Force -Path dist/plugmesh-server/sdk/include/plugmesh, dist/plugmesh-server/sdk/lib, dist/plugmesh-server/sdk/examples, dist/plugmesh-server/sdk/plugins/sample.plugin | Out-Null
          Copy-Item native-server/include/plugmesh/*.h dist/plugmesh-server/sdk/include/plugmesh/
          Copy-Item native-server/examples/sample_plugin.cpp dist/plugmesh-server/sdk/examples/
          Copy-Item native-server/build-win/Release/plugmesh-server.dll dist/plugmesh-server/
          Copy-Item native-server/build-win/Release/plugmesh-server.lib dist/plugmesh-server/sdk/lib/
          Copy-Item native-server/build-win/plugins/sample.plugin/* dist/plugmesh-server/sdk/plugins/sample.plugin/
          Copy-Item native-server/PORT-MAPPING.md dist/plugmesh-server/PORT-MAPPING.md
          Get-ChildItem "$vcpkg\installed\x64-windows\bin\*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination dist/plugmesh-server/
          Compress-Archive -Path dist/plugmesh-server -DestinationPath dist/plugmesh-server-windows.zip -Force
          (Get-FileHash dist/plugmesh-server-windows.zip -Algorithm SHA256).Hash.ToLower() + '  plugmesh-server-windows.zip' |
            Set-Content -Encoding ascii dist/plugmesh-server-windows.zip.sha256

      - name: 打包（macOS）
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist/plugmesh-server
          cp native-server/build/plugmesh-server dist/plugmesh-server/
          mkdir -p dist/plugmesh-server/native-ui/dist
          cp -R native-ui/dist/. dist/plugmesh-server/native-ui/dist/
          cp native-server/README.md dist/plugmesh-server/README.md
          cp native-server/build/plugmesh-plugin-host dist/plugmesh-server/
          mkdir -p dist/plugmesh-server/sdk/include/plugmesh dist/plugmesh-server/sdk/lib dist/plugmesh-server/sdk/examples dist/plugmesh-server/sdk/plugins/sample.plugin
          cp native-server/include/plugmesh/*.h dist/plugmesh-server/sdk/include/plugmesh/
          cp native-server/examples/sample_plugin.cpp dist/plugmesh-server/sdk/examples/
          cp native-server/build/libplugmesh-server.dylib dist/plugmesh-server/sdk/lib/
          cp native-server/build/libplugmesh-server.dylib dist/plugmesh-server/
          cp native-server/build/plugins/sample.plugin/* dist/plugmesh-server/sdk/plugins/sample.plugin/
          openssl_prefix="$(brew --prefix openssl@3)"
          cp "$openssl_prefix/lib/libssl.3.dylib" "$openssl_prefix/lib/libcrypto.3.dylib" dist/plugmesh-server/
          cp "$openssl_prefix/lib/libssl.3.dylib" "$openssl_prefix/lib/libcrypto.3.dylib" dist/plugmesh-server/sdk/lib/
          for ssl_library in dist/plugmesh-server/libssl.3.dylib dist/plugmesh-server/sdk/lib/libssl.3.dylib; do
            crypto_path="$(otool -L "$ssl_library" | awk '/libcrypto\.3\.dylib/ { print $1; exit }')"
            if [ -n "$crypto_path" ]; then install_name_tool -change "$crypto_path" '@loader_path/libcrypto.3.dylib' "$ssl_library"; fi
          done
          for binary in dist/plugmesh-server/plugmesh-server dist/plugmesh-server/plugmesh-plugin-host; do
            ssl_path="$(otool -L "$binary" | awk '/libssl\.3\.dylib/ { print $1; exit }')"
            crypto_path="$(otool -L "$binary" | awk '/libcrypto\.3\.dylib/ { print $1; exit }')"
            if [ -n "$ssl_path" ]; then install_name_tool -change "$ssl_path" '@executable_path/libssl.3.dylib' "$binary"; fi
            if [ -n "$crypto_path" ]; then install_name_tool -change "$crypto_path" '@executable_path/libcrypto.3.dylib' "$binary"; fi
          done
          ssl_path="$(otool -L dist/plugmesh-server/libplugmesh-server.dylib | awk '/libssl\.3\.dylib/ { print $1; exit }')"
          crypto_path="$(otool -L dist/plugmesh-server/libplugmesh-server.dylib | awk '/libcrypto\.3\.dylib/ { print $1; exit }')"
          if [ -n "$ssl_path" ]; then install_name_tool -change "$ssl_path" '@loader_path/libssl.3.dylib' dist/plugmesh-server/libplugmesh-server.dylib; fi
          if [ -n "$crypto_path" ]; then install_name_tool -change "$crypto_path" '@loader_path/libcrypto.3.dylib' dist/plugmesh-server/libplugmesh-server.dylib; fi
          cp dist/plugmesh-server/libplugmesh-server.dylib dist/plugmesh-server/sdk/lib/
          cp native-server/PORT-MAPPING.md dist/plugmesh-server/PORT-MAPPING.md
          cd dist
          zip -r plugmesh-server-macos.zip plugmesh-server
          shasum -a 256 plugmesh-server-macos.zip > plugmesh-server-macos.zip.sha256

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: plugmesh-server-${{ matrix.name }}
          path: dist/*.zip*
          if-no-files-found: error

  termux:
    name: 构建 Android Termux CLI
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 查找本次标签的预构建 Termux 资产
        id: prebuilt
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          ref="termux-release-${RELEASE_TAG}"
          if git ls-remote --exit-code --heads origin "$ref" >/dev/null; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载预构建 Termux 资产
        if: steps.prebuilt.outputs.ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.prebuilt.outputs.ref }}
          path: termux-prebuilt

      - name: 准备 Node.js 和本地 UI
        if: steps.prebuilt.outputs.ref == ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建本地 UI
        if: steps.prebuilt.outputs.ref == ''
        run: |
          npm ci
          npm run native-ui:build

      - name: 放置并校验预构建 Termux 资产
        if: steps.prebuilt.outputs.ref != ''
        run: |
          set -euo pipefail
          test "$(cat termux-prebuilt/SOURCE_COMMIT)" = "$GITHUB_SHA"
          mkdir -p dist
          cp termux-prebuilt/plugmesh-server-termux.tar.gz* dist/

      - name: 使用 Termux builder 构建
        if: steps.prebuilt.outputs.ref == ''
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --entrypoint /bin/bash \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            androidzeros/termux-package-builder:latest \
            -lc 'export PREFIX=/data/data/com.termux/files/usr; bash scripts/build-termux-native.sh --artifact-type ALL --build-type Release --include-ui'

      - name: 校验 Termux 构建结果
        run: |
          set -euo pipefail
          test -f dist/plugmesh-server-termux.tar.gz
          (cd dist && sha256sum -c plugmesh-server-termux.tar.gz.sha256)

      - name: 上传 Termux 产物
        uses: actions/upload-artifact@v4
        with:
          name: plugmesh-server-termux
          path: |
            dist/plugmesh-server-termux.tar.gz
            dist/plugmesh-server-termux.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: 创建 Release
    needs: [build, termux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            Plugmesh 原生端构建产物（未签名，请核对 `SHA256SUMS` 后再运行）。

            - `plugmesh-server-linux.zip`：Linux x86_64（内含 OpenSSL 3 运行库）
            - `plugmesh-server-windows.zip`：Windows x64（内含随包 OpenSSL DLL）
            - `plugmesh-server-macos.zip`：macOS（`brew install openssl@3`）
             - `plugmesh-server-termux.tar.gz`：Android Termux CLI（不是 APK，需在 Termux 中解压并安装 clang/cmake/openssl/zlib 运行依赖）

            校验：`sha256sum -c SHA256SUMS`；从源码构建方式见仓库 `native-server/README.md`。
