name = "plugmesh-worker"
main = "src/index.ts"
compatibility_date = "2026-10-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker 必须先处理请求，否则静态资源层会在插件域名根路径直接返回控制台 SPA。
run_worker_first = true

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "plugmesh"
database_id = "replace-with-d1-database-id"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "PLUGIN_BRIDGE"
class_name = "PluginBridge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PluginBridge"]

[[r2_buckets]]
binding = "BLOB_BUCKET"
bucket_name = "plugmesh-blobs"
