name = "plugmesh-worker"
main = "worker/src/index.ts"
compatibility_date = "2026-10-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker 必须先处理请求，否则静态资源层会在插件域名根路径直接返回控制台 SPA。
run_worker_first = true

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "plugmesh"
database_id = "4ecf50f9-35b4-4513-894f-843ab88540b4"
# Deploy Button / Workers Builds 会自动创建并回填 database_id；npm run deploy 也会自动补齐。
migrations_dir = "worker/migrations"

[[durable_objects.bindings]]
name = "PLUGIN_BRIDGE"
class_name = "PluginBridge"

[[durable_objects.bindings]]
name = "TUNNEL_SESSION"
class_name = "TunnelSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PluginBridge"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TunnelSession"]

[[r2_buckets]]
binding = "BLOB_BUCKET"
bucket_name = "plugmesh-blobs"
